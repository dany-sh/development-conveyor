[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "development-conveyor"
version = "0.1.0"
description = "Portfolio-level controller for the user-wide Codex Development Factory"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
development-conveyor = "development_conveyor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
